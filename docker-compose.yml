services:
  db:
    image: postgres:16-alpine
    env_file: .env.docker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 5s
      retries: 30

  web:
    build: .
    env_file: .env.docker
    command: sh -c "python manage.py collectstatic --noinput && exec python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - .:/app
      - media_data:/app/media
      - static_data:/app/static
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/srv/media:ro
      - static_data:/srv/static:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  static_data:
  media_data:
  postgres_data:
