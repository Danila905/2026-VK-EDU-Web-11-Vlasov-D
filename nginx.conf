server {
    listen 80;
    client_max_body_size 16m;

    location /media/ {
        alias /srv/media/;
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "sandbox";
    }

    location /static/ {
        alias /srv/static/;
    }

    location / {
        proxy_set_header Host $http_host;
        proxy_pass http://web:8000;
    }
}
