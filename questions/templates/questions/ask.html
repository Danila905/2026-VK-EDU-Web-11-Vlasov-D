{% extends 'base.html' %}
{% block title %}Ask - AskSmth{% endblock %}
{% block content %}
<h1 class="form-title">Задать вопрос</h1>
<form action="{% url 'questions:ask' %}" class="form-card ask-form" method="post">
{% csrf_token %}
{% for error in form.non_field_errors %}<div class="form-error">{{ error }}</div>{% endfor %}
{% for field in form %}{% include 'includes/form_field.html' %}{% endfor %}
<div class="button-row"><button class="primary-btn" type="submit">Опубликовать вопрос</button></div>
</form>
{% endblock %}
