<div class="field">
<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="required">*</span>{% endif %}</label>
{{ field }}
{% for error in field.errors %}<div class="field-error">{{ error }}</div>{% endfor %}
{% if field.help_text %}<div class="hint" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
</div>
