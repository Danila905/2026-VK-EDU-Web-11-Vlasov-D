{% load static %}
<header class="site-header">
<a class="brand" href="{% url 'questions:index' %}"><span class="brand-icon"><img alt="" class="icon" height="29" src="{% static 'core/img/chat.svg' %}" width="29"> <b>&lt;/&gt;</b></span> AskSmth</a>
<form action="{% url 'questions:index' %}" class="search-box" method="get" role="search">
<img alt="" class="icon" height="21" src="{% static 'core/img/search.svg' %}" width="21">
<input aria-label="Поиск по вопросам" class="search-input" name="q" placeholder="Поиск по вопросам..." type="search" value="{{ request.GET.q }}">
</form>
{% if user.is_authenticated %}
<a class="ask-btn" href="{% url 'questions:ask' %}">ASK!</a>
<div class="auth-links">
<a class="profile-mark" aria-label="Профиль {{ user.username }}" href="{% url 'core:profile' %}">{% include 'includes/avatar.html' with avatar=user.profile.avatar size=25 %}</a>
<form action="{% url 'core:logout' %}" method="post">
{% csrf_token %}
<input type="hidden" name="next" value="{{ request.get_full_path }}">
<button class="logout-link" type="submit">Выйти</button>
</form>
</div>
{% else %}
<button class="ask-btn" type="button" disabled title="Войдите, чтобы задать вопрос">ASK!</button>
<div class="auth-links"><a href="{% url 'core:login' %}{% if section != 'login' and section != 'signup' %}?next={{ request.get_full_path|urlencode:'' }}{% endif %}">Войти</a> <a href="{% url 'core:signup' %}">Регистрация</a></div>
{% endif %}
</header>
